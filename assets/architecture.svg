<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blue-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="card-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes flow {
      to {
        stroke-dashoffset: -30;
      }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    .flow-pipe {
      stroke-dasharray: 6, 9;
      animation: flow 1.5s linear infinite;
    }
    .flow-pipe-reverse {
      stroke-dasharray: 6, 9;
      animation: flow 1.5s linear infinite;
      animation-direction: reverse;
    }
    .node-card {
      transition: transform 0.3s ease;
    }
    .node-card:hover {
      transform: translateY(-4px);
    }
    .node-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 700;
      fill: #ffffff;
      font-size: 13px;
    }
    .node-subtitle {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 500;
      fill: #64748b;
      font-size: 9px;
    }
    .node-desc {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
      font-size: 10px;
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="400" rx="20" fill="#07080c" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1000" height="400" rx="20" fill="url(#card-glow)"/>

  <!-- Grid lines -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 L 1000,50 M 0,100 L 1000,100 M 0,150 L 1000,150 M 0,200 L 1000,200 M 0,250 L 1000,250 M 0,300 L 1000,300 M 0,350 L 1000,350"/>
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400"/>
  </g>

  <!-- Flow Paths -->
  <!-- User App to API Gateway -->
  <path d="M 220,200 L 330,200" stroke="#6366f1" stroke-width="3" opacity="0.15"/>
  <path d="M 220,200 L 330,200" stroke="url(#blue-purple)" stroke-width="2" class="flow-pipe"/>

  <!-- API Gateway to Agent Orchestrator -->
  <path d="M 500,200 L 610,200" stroke="#a855f7" stroke-width="3" opacity="0.15"/>
  <path d="M 500,200 L 610,200" stroke="url(#blue-purple)" stroke-width="2" class="flow-pipe"/>

  <!-- Orchestrator to RAG (Split Up) -->
  <path d="M 780,200 L 810,200 L 810,120 L 830,120" stroke="#ec4899" stroke-width="3" opacity="0.15" fill="none"/>
  <path d="M 780,200 L 810,200 L 810,120 L 830,120" stroke="url(#purple-pink)" stroke-width="2" class="flow-pipe" fill="none"/>

  <!-- Orchestrator to LLM (Split Down) -->
  <path d="M 780,200 L 810,200 L 810,280 L 830,280" stroke="#ec4899" stroke-width="3" opacity="0.15" fill="none"/>
  <path d="M 780,200 L 810,200 L 810,280 L 830,280" stroke="url(#purple-pink)" stroke-width="2" class="flow-pipe" fill="none"/>

  <!-- RAG to LLM Connection (Context feed) -->
  <path d="M 915,165 L 915,235" stroke="#10b981" stroke-width="3" opacity="0.15"/>
  <path d="M 915,165 L 915,235" stroke="#10b981" stroke-width="2" class="flow-pipe"/>

  <!-- LLM back to User (Return pipeline) -->
  <path d="M 915,315 L 915,360 L 135,360 L 135,235" stroke="#6366f1" stroke-width="3" opacity="0.15" fill="none"/>
  <path d="M 915,315 L 915,360 L 135,360 L 135,235" stroke="url(#blue-purple)" stroke-width="2" class="flow-pipe-reverse" fill="none"/>

  <!-- NODE 1: User App -->
  <g class="node-card" transform="translate(50, 140)">
    <rect width="170" height="95" rx="12" fill="#0b0d13" stroke="#312e81" stroke-width="1.5"/>
    <rect width="170" height="95" rx="12" fill="url(#card-glow)"/>
    <circle cx="25" cy="25" r="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <path d="M 21,25 L 29,25 M 25,21 L 25,29" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="45" y="24" class="node-title">User App</text>
    <text x="45" y="34" class="node-subtitle">CLIENT SIDE</text>
    <text x="15" y="62" class="node-desc">Client interfaces requesting</text>
    <text x="15" y="76" class="node-desc">AI agent completions.</text>
  </g>

  <!-- NODE 2: API Gateway -->
  <g class="node-card" transform="translate(330, 140)">
    <rect width="170" height="95" rx="12" fill="#0b0d13" stroke="#581c87" stroke-width="1.5"/>
    <rect width="170" height="95" rx="12" fill="url(#card-glow)"/>
    <circle cx="25" cy="25" r="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.2"/>
    <path d="M 21,22 L 29,22 M 21,28 L 29,28" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round"/>
    <text x="45" y="24" class="node-title">API Gateway</text>
    <text x="45" y="34" class="node-subtitle">AUTHENTICATION</text>
    <text x="15" y="62" class="node-desc">Tokens validation, security</text>
    <text x="15" y="76" class="node-desc">audits, and request limits.</text>
  </g>

  <!-- NODE 3: Agent Orchestrator -->
  <g class="node-card" transform="translate(610, 140)">
    <rect width="170" height="95" rx="12" fill="#0b0d13" stroke="#831843" stroke-width="1.5"/>
    <rect width="170" height="95" rx="12" fill="url(#card-glow)"/>
    <circle cx="25" cy="25" r="10" fill="#500724" stroke="#ec4899" stroke-width="1.2"/>
    <path d="M 21,25 L 29,25 M 25,21 L 25,29" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>
    <text x="45" y="24" class="node-title">Agent Router</text>
    <text x="45" y="34" class="node-subtitle">COGNITIVE HUB</text>
    <text x="15" y="62" class="node-desc">Orchestrates workflows</text>
    <text x="15" y="76" class="node-desc">and handles tool calling.</text>
  </g>

  <!-- NODE 4: RAG Engine -->
  <g class="node-card" transform="translate(830, 70)">
    <rect width="140" height="95" rx="12" fill="#0b0d13" stroke="#064e3b" stroke-width="1.5"/>
    <rect width="140" height="95" rx="12" fill="url(#card-glow)"/>
    <circle cx="25" cy="25" r="10" fill="#022c22" stroke="#10b981" stroke-width="1.2"/>
    <path d="M 21,25 L 29,25" stroke="#34d399" stroke-width="1.5"/>
    <text x="45" y="24" class="node-title">RAG Engine</text>
    <text x="45" y="34" class="node-subtitle">VECTOR DB</text>
    <text x="15" y="62" class="node-desc">Retrieves custom context</text>
    <text x="15" y="76" class="node-desc">from vector store.</text>
  </g>

  <!-- NODE 5: LLM Inference -->
  <g class="node-card" transform="translate(830, 220)">
    <rect width="140" height="95" rx="12" fill="#0b0d13" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="140" height="95" rx="12" fill="url(#card-glow)"/>
    <circle cx="25" cy="25" r="10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 22,23 L 28,27 M 28,23 L 22,27" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="45" y="24" class="node-title">LLM Models</text>
    <text x="45" y="34" class="node-subtitle">INFERENCE</text>
    <text x="15" y="62" class="node-desc">Generates the aligned</text>
    <text x="15" y="76" class="node-desc">brand responses.</text>
  </g>
</svg>
